<script type="text/javascript">

	vers.innerText = "您的程序版本为：v"+window.external.version;
	vers.style.display = "block";

var rndimg = [
	"https://images2.alphacoders.com/106/1064544.jpg",
	"https://images3.alphacoders.com/110/1102108.jpg",

	"https://images5.alphacoders.com/112/1127881.jpg",
];

function rndwp(){
	var rndurl;
	if(exthas('hasWallpaper') && window.external.hasWallpaper(index) > 0){
		try{
			rndurl = window.external.rndWallpaper(index);
		}catch(e){
			rndurl = window.external.rndWallpaper();
		}
	} else {
		rndurl = rndimg[Math.floor(Math.random()*rndimg.length)];
	}
	document.body.style.backgroundImage = "url('"+rndurl+"')";
}
rndwp();

if(exthas('hasLnk')){
	try{
		lnks.innerHTML = window.external.getLnkHtml(index);
	}catch(e){
		lnks.innerHTML = window.external.getLnkHtml();
	}
	lnks.style.display = "block";
}
</script>
